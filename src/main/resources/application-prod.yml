
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

  h2:
    console:
      enabled: false  # deactivated in prod for safety

migration:
  zoho:
    page-size: 200    # max in prod

  manatal:
    rate-limit-ms: 300

  batch:
    chunk-size: 50
    retry-limit: 3
    skip-limit: 100 # 100 fails

  alerts:
    enabled: true 


logging:
  level:
    com.migration: INFO
    org.springframework.batch: INFO
    org.springframework.web.client: WARN
  file:
    name: logs/migration.log
    max-size: 50MB
    max-history: 30
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    file:    "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
