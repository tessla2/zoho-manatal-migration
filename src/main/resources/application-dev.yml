spring:
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:h2:mem:migration;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

logging:
  level:
    com.migration: DEBUG

migration:
  manatal:
    rate-limit-ms: 10

  security:
    jwt-secret: dev-secret-key-que-tem-pelo-menos-256-bits-para-hmac-sha
    admin-username: admin
    admin-password: admin

  batch:
    chunk-size: 1
