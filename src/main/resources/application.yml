spring:
  application:
    name: zoho-manatal-migration

  profiles:
    active: prod

  jackson:
    serialization:
      write-dates-as-timestamps: false

  batch:
    job:
      enabled: false

  jpa:
    open-in-view: false

  mvc:
    async:
      request-timeout: 300000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,batch
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.migration: INFO
    org.springframework.batch: INFO
  file:
    name: logs/migration.log

migration:
  zoho:
    oauth:
      client-id: ${ZOHO_CLIENT_ID}
      client-secret: ${ZOHO_CLIENT_SECRET}
      refresh-token: ${ZOHO_REFRESH_TOKEN}
      token-url: https://accounts.zoho.eu/oauth/v2/token
    tag-name: ${ZOHO_TAG_NAME:PendenteMigracao}
    success-tag-name: ${ZOHO_SUCCESS_TAG_NAME:Exported}
    base-url: https://recruit.zoho.eu/recruit/v2
    date-start: ${MIGRATION_DATE_START:2026-04-01}
    date-end:   ${MIGRATION_DATE_END:2026-06-30}
    page-size: 200
    rate-limit-threshold: ${ZOHO_RATE_LIMIT_THRESHOLD:100}
    rate-limit-critical-threshold: ${ZOHO_RATE_LIMIT_CRITICAL_THRESHOLD:20}
    rate-limit-halt-threshold: ${ZOHO_RATE_LIMIT_HALT_THRESHOLD:5}
    rate-limit-wait-ms: ${ZOHO_RATE_LIMIT_WAIT_MS:60000}
    rate-limit-ms: 800

  manatal:
    token: ${MANATAL_TOKEN}
    base-url: https://api.manatal.com/open/v3/
    rate-limit-ms: 3000

  app:
    base-url: ${MIGRATION_APP_BASE_URL:http://localhost:8080}

  batch:
    chunk-size: 3
    retry-limit: 3
    skip-limit: 100
    max-per-run: 500

  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-hours: 24
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD}

  alerts:
    enabled: ${ALERTS_ENABLED:false}
    slack-webhook: ${SLACK_WEBHOOK_URL:}
    email:
      to: ${ALERT_EMAIL_TO:}
      from: ${ALERT_EMAIL_FROM:migration@company.com}
